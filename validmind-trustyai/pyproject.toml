[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validmind-trustyai"
version = "0.1.0"
description = "ValidMind tests that read bias, drift, and data-health metrics from a TrustyAI service on Red Hat OpenShift AI and log the evidence to the ValidMind Platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ValidMind", email = "support@validmind.com" }]
dependencies = [
    "validmind>=2.13",
    "requests>=2.28",
]

[project.optional-dependencies]
evalhub = [
    "eval-hub-sdk[client]>=0.1.5",
]
dev = [
    "pytest>=7",
    "responses>=0.23",
]

[project.urls]
Repository = "https://github.com/rh-ai-quickstart/test-and-validate-models-with-validmind"

[tool.hatch.build.targets.wheel]
packages = ["src/validmind_trustyai"]
