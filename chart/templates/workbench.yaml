{{- $name := include "quickstart.workbenchName" . -}}
{{/*
The OpenShift AI workbench. Only the minimal Notebook CR is written here:
the notebook controller's mutating webhook injects the oauth proxy sidecar,
service account, TLS, and Route from the inject-oauth/inject-auth annotation.
The container name MUST equal the CR name — the webhook rejects it otherwise.

An init container seeds the quickstart notebook into the persistent home
directory on first start; it never overwrites, so user edits win.
*/}}
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "quickstart.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    openshift.io/display-name: {{ .Values.workbench.displayName | quote }}
    openshift.io/description: "JupyterLab workbench pre-loaded with the ValidMind quickstart notebook."
    # RHOAI 2.x uses inject-oauth; 3.x renamed it to inject-auth. Setting both
    # keeps the chart working across versions (each ignores the other's key).
    notebooks.opendatahub.io/inject-oauth: "true"
    notebooks.opendatahub.io/inject-auth: "true"
    notebooks.opendatahub.io/last-image-selection: {{ .Values.workbench.imageSelection | quote }}
    opendatahub.io/image-display-name: {{ .Values.workbench.imageDisplayName | quote }}
    {{- with .Values.workbench.username }}
    opendatahub.io/username: {{ . | quote }}
    {{- end }}
    opendatahub.io/connections: {{ printf "%s/%s" .Release.Namespace (include "quickstart.connectionName" .) | quote }}
spec:
  template:
    spec:
      affinity: {}
      enableServiceLinks: false
      initContainers:
        - name: load-notebooks
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              for f in /quickstart-notebooks/*.ipynb; do
                b=$(basename "$f")
                if [ ! -f "/mnt/home/$b" ]; then
                  cp "$f" "/mnt/home/$b" && echo "seeded $b"
                else
                  echo "$b already present — keeping the user's copy"
                fi
              done
          volumeMounts:
            - name: {{ $name }}
              mountPath: /mnt/home
            - name: quickstart-notebooks
              mountPath: /quickstart-notebooks
      containers:
        - name: {{ $name }}
          image: {{ .Values.workbench.image | quote }}
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/{{ .Release.Namespace }}/{{ $name }}
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: {{ .Values.workbench.image | quote }}
          envFrom:
            - secretRef:
                name: {{ include "quickstart.connectionName" . }}
          ports:
            - name: notebook-port
              containerPort: 8888
              protocol: TCP
          resources:
            {{- toYaml .Values.workbench.resources | nindent 12 }}
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /notebook/{{ .Release.Namespace }}/{{ $name }}/api
              port: notebook-port
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /notebook/{{ .Release.Namespace }}/{{ $name }}/api
              port: notebook-port
          volumeMounts:
            - name: {{ $name }}
              mountPath: /opt/app-root/src
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $name }}
        - name: shm
          emptyDir:
            medium: Memory
        - name: quickstart-notebooks
          configMap:
            name: {{ include "quickstart.name" . }}-notebooks
